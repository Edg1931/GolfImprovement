name: Course scan check

on:
  push:
    paths:
      - 'lib/scan.js'
      - 'api/scan.js'
      - 'tests/scan-eval/**'
      - '.github/workflows/scan-eval.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Scan courses that OpenStreetMap has mapped and compare
        run: node tests/scan-eval/eval.js
